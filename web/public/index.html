<!doctype html><html><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="/app.css">
</head><body>
  <header id="site-header"></header>
  <main class="page-container">
    <div class="login-box">
    <h1>Login</h1>
    <form id="loginForm">
      <p><input type="email" id="email" placeholder="Email" required></p>
      <p>
        <span class="password-wrap">
          <input type="password" id="password" placeholder="Password" required>
          <span class="password-overlay" id="passwordOverlay" aria-hidden="true"></span>
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" aria-pressed="false">
            <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </span>
      </p>
      <p><button type="submit" class="btn">Login</button></p>
    </form>
    </div>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body></html>

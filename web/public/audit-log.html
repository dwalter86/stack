<!doctype html><html><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit log</title>
  <link rel="stylesheet" href="/app.css">
</head><body>
  <header id="site-header"></header>
  <main class="page-container" data-disable-auto-update="true">
    <p><a href="/settings.html" class="btn btnBack">Back</a></p>
    <h1>Audit log</h1>
    <p class="small">Every change and login attempt across the platform. Visible to super admins only.</p>

    <div class="card audit-filters">
      <input type="text" id="filterUser" placeholder="User email">
      <select id="filterAction"><option value="">All actions</option></select>
      <input type="date" id="filterFrom" title="From date">
      <input type="date" id="filterTo" title="To date">
      <input type="text" id="filterSearch" placeholder="Search details...">
      <button class="btn" id="applyFilters">Apply</button>
      <button class="btn" id="clearFilters">Clear</button>
    </div>

    <div id="auditMeta" class="small"></div>
    <div class="audit-table-wrap">
      <table class="audit-table">
        <thead>
          <tr><th>Time</th><th>User</th><th>Action</th><th>Status</th><th>IP</th><th>Path</th><th></th></tr>
        </thead>
        <tbody id="auditRows"></tbody>
      </table>
    </div>
    <div class="audit-pager">
      <button class="btn" id="pagePrev">&larr; Newer</button>
      <span id="pageInfo" class="small"></span>
      <button class="btn" id="pageNext">Older &rarr;</button>
    </div>
  </main>
  <script type="module" src="/js/audit-log.js"></script>
</body></html>

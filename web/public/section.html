<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Section</title>
  <link rel="stylesheet" href="/app.css">
</head>

<body>
  <header id="site-header"></header>
  <main class="page-container">
    <div class="account-header">
      <div class="account-header-main">
        <a class="btnBack" href="#" id="backLink">Back</a>
        <div>
          <div class="page-eyebrow" id="pageEyebrow"></div>
          <h1 id="sectionTitle">Section</h1>
          <p class="small" id="sectionMeta"></p>
        </div>
      </div>
      <div class="account-header-actions">
        <button id="sectionMenuButton" class="icon-btn" aria-haspopup="true" aria-expanded="false"
          aria-label="Section actions">⋯</button>
        <div id="sectionMenu" class="dropdown-menu">
          <button type="button" data-action="edit" id="editSectionMenuLabel">Edit section</button>
          <button type="button" data-action="settings" id="itemSettingsMenuLabel">Settings</button>
          <button type="button" data-action="save-sort" id="saveSortMenuLabel">Set default sort</button>
          <button type="button" data-action="delete" class="danger" id="deleteSectionMenuLabel">Delete section</button>
        </div>
        <button type="button" class="btn" id="exportItemsBtn">Export</button>
        <a class="btn" id="notesBtn" href="#">Notes</a>
        <button type="button" class="btn primary" id="addItemBtn">Add item</button>
      </div>
    </div>

    <section class="card">
      <div class="items-toolbar">
        <h2 style="margin:0;" id="itemsHeading">Items</h2>
        <div class="items-toolbar-controls">
          <div class="zoom-controls" aria-label="Item list zoom controls">
            <button type="button" class="btn" id="itemsZoomOutBtn" aria-label="Zoom out item list">🔍−</button>
            <button type="button" class="btn" id="itemsZoomResetBtn" aria-label="Reset item list zoom">100%</button>
            <button type="button" class="btn" id="itemsZoomInBtn" aria-label="Zoom in item list">🔍+</button>
          </div>
          <input type="text" id="itemSearch" placeholder="Search items..." class="input items-search-input">
        </div>
      </div>
      <div id="itemsEmptyState" class="empty-state hidden">
        <p class="small" id="itemsEmptyCopy">No items in this section yet.</p>
      </div>
      <div id="itemsTableContainer" class="table-wrapper"></div>
    </section>

    <!-- Modal for creating an item -->
    <div id="itemModal" class="modal-backdrop hidden">
      <div class="modal">
        <h2 id="itemModalTitle">Add item</h2>
        <!-- Adding scrollable content -->
        <div id="modalContent" style="max-height:60vh;overflow-y:auto;">
          <form id="itemForm">
            <p><label>Name<input type="text" id="itemName" required></label></p>

            <div id="schemaFieldsContainer" class="schema-fields hidden"></div>

            <div id="kvEditorContainer" class="kv-editor hidden">
              <p class="small">Define key/value pairs for this item's data.</p>
              <div class="table-wrapper">
                <table class="kv-table">
                  <thead>
                    <tr>
                      <th>Key</th>
                      <th>Value</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="kvRows"></tbody>
                </table>
            </div>
              <div class="actions" style="justify-content:flex-start;margin-top:8px;">
                <button type="button" id="addKVRowBtn" class="btn">Add row</button>
              </div>
            </div>

            <div class="modal-actions">
              <button type="button" class="btn" id="itemCancel">Cancel</button>
              <button type="submit" class="btn primary">Save</button>
            </div>
          </form>
        </div> <!-- Scrollable Content END here -->
        <p id="itemMsg" class="small"></p>
      </div>
    </div>

    <!-- Modal for choosing export format -->
    <div id="exportModal" class="modal-backdrop hidden">
      <div class="modal">
        <h2>Export</h2>
        <p class="small" id="exportSubtitle">Choose a format. Showing <strong id="exportItemCount">0</strong> items.</p>
        <div id="exportTemplateMissing" class="small hidden" style="margin:8px 0;color:#b00020;">
          No template uploaded for this account.
          <a href="#" id="exportTemplateLink">Upload one on the account page</a> to enable PDF and Word exports.
        </div>
        <div class="modal-actions" style="flex-wrap:wrap;justify-content:flex-start;">
          <button type="button" class="btn primary" id="exportPdfBtn">PDF (from template)</button>
          <button type="button" class="btn" id="exportDocxBtn">Word (.docx)</button>
          <button type="button" class="btn" id="exportXlsxBtn">Spreadsheet (.xlsx)</button>
        </div>
        <p id="exportMsg" class="small" style="margin-top:8px;"></p>
        <div class="modal-actions">
          <button type="button" class="btn" id="exportCancel">Close</button>
        </div>
      </div>
    </div>

    <div id="editSectionModal" class="modal-backdrop hidden">
      <div class="modal">
        <h2>Edit section</h2>
        <form id="editSectionForm">
          <p>
            <label>Section name
              <input type="text" id="editSectionLabel" required>
            </label>
          </p>
          <p>
            <label>Detail
              <input type="text" id="editSectionDetail" placeholder="Optional detail">
            </label>
          </p>
          <div class="modal-actions">
            <button type="button" class="btn" id="editSectionCancel">Cancel</button>
            <button type="submit" class="btn primary">Save</button>
          </div>
        </form>
        <p id="editSectionMsg" class="small"></p>
      </div>
    </div>
  </main>
  <script type="module" src="/js/auto-updater.js"></script>
  <script type="module" src="/js/section.js"></script>
</body>

</html>

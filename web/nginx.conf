server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ { proxy_pass http://api:8000/api/; }
  location /docs { proxy_pass http://api:8000/docs; }
  location /openapi.json { proxy_pass http://api:8000/openapi.json; }
  location /redoc { proxy_pass http://api:8000/redoc; }

  # Assets are not fingerprinted, so force revalidation on every load;
  # ETags turn unchanged files into cheap 304s and deploys take effect immediately.
  location ~* \.(?:html|js|css)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location / { try_files $uri $uri/ /index.html; }
}
